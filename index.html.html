<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    <link rel="stylesheet" href="style.css">
   <script src="todolist.js" defer></script>
</head>s

<body>

    <div class="container">



        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your tasks and stay productive</p>

        <div class="task-form">

            <input class="task-input" type="text" placeholder="Enter task title">

            <input class="description-input" type="text" placeholder="Task description">

            <select class="category-input">
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
                <option value="Other">Other</option>
            </select>

            <select class="priority-input">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <button class="add-btn">Add Task</button>

        </div>



        <div class="search-box">
            <input class="search-input" type="text" placeholder="Search tasks...">
        </div>

        <div class="controls">

            <div class="filters">
                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="pending">
                    Pending
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>
            </div>



            <select class="sort-select">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="high">High Priority</option>
                <option value="low">Low Priority</option>
            </select>

        </div>




        <div class="task-info">

            <span>
                Total: <b class="total-tasks">0</b>
            </span>

            <span>
                Pending: <b class="pending-tasks">0</b>
            </span>

            <span>
                Completed: <b class="completed-tasks">0</b>
            </span>

        </div>

        <div class="task-list"></div>

        <button class="clear-btn">
            Clear Completed
        </button>

    </div>

</body>
</html>
